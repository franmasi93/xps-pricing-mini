<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambiar contraseña · XPS Pricing</title>
  <link rel="icon" href="img/xpress-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/xps-pricing.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <img class="sidebar-logo" src="img/xpress-logo.png" alt="XPRESS">
      <nav class="sidebar-nav" id="menu" aria-label="Menú principal"></nav>
      <div class="perfil">
        <span class="avatar" id="usuario-avatar" aria-hidden="true"></span>
        <div class="perfil-datos">
          <span class="perfil-nombre" id="usuario-nombre"></span>
          <span class="perfil-rol" id="usuario-rol"></span>
        </div>
        <button class="btn btn-secundario btn-chico" id="btn-salir" type="button">Salir</button>
      </div>
    </aside>

    <div class="area">
      <header class="topbar">
        <div>
          <h1>Cambiar contraseña</h1>
          <p class="topbar-subtitulo">Seguridad de su cuenta</p>
        </div>
      </header>

      <main class="contenido contenido-angosto">
        <div id="aviso-forzado" hidden></div>
        <div id="alertas" hidden></div>

        <section class="tarjeta">
          <form id="form-cambio" novalidate>
            <div class="campo">
              <label for="password-actual">Contraseña actual</label>
              <input class="input" id="password-actual" name="actual" type="password" autocomplete="current-password" required>
            </div>
            <div class="campo">
              <label for="password-nueva">Nueva contraseña</label>
              <input class="input" id="password-nueva" name="nueva" type="password" autocomplete="new-password" required>
              <span class="ayuda" id="politica"></span>
            </div>
            <div class="campo">
              <label for="password-confirmacion">Confirme la nueva contraseña</label>
              <input class="input" id="password-confirmacion" name="confirmacion" type="password" autocomplete="new-password" required>
            </div>
            <div class="acciones-form">
              <button class="btn btn-primario" id="btn-guardar" type="submit">Guardar contraseña</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/cambiar-password.js"></script>
</body>
</html>
