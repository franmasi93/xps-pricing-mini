<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio · XPS Pricing</title>
  <link rel="icon" href="img/xpress-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/xps-pricing.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <img class="sidebar-logo" src="img/xpress-logo.png" alt="XPRESS">
      <nav class="sidebar-nav" id="menu" aria-label="Menú principal"></nav>
      <div class="perfil">
        <span class="avatar" id="usuario-avatar" aria-hidden="true"></span>
        <div class="perfil-datos">
          <span class="perfil-nombre" id="usuario-nombre"></span>
          <span class="perfil-rol" id="usuario-rol"></span>
        </div>
        <button class="btn btn-secundario btn-chico" id="btn-salir" type="button">Salir</button>
      </div>
    </aside>

    <div class="area">
      <header class="topbar">
        <div>
          <h1>Inicio</h1>
          <p class="topbar-subtitulo">Tarifas y cotizaciones de carga internacional</p>
        </div>
      </header>

      <main class="contenido">
        <div id="alertas" hidden></div>

        <section class="tarjeta" id="bienvenida" hidden>
          <h3 id="saludo"></h3>
          <p id="detalle-rol" class="texto-suave"></p>
          <p>El cotizador y el envío de cotizaciones estarán disponibles próximamente.</p>
        </section>

        <section class="tarjeta" id="bloque-por-vencer" hidden>
          <div class="tarjeta-cabecera">
            <div>
              <h3>Tarifas por vencer</h3>
              <p class="texto-suave" id="por-vencer-bajada"></p>
            </div>
            <a class="btn btn-secundario btn-chico" href="tarifas.html">Ver tarifas</a>
          </div>
          <table class="tabla">
            <thead>
              <tr><th>Ruta</th><th>Modo</th><th>Proveedor</th><th>Venta</th><th>Vence</th></tr>
            </thead>
            <tbody id="tabla-por-vencer"></tbody>
          </table>
        </section>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
